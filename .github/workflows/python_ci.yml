name: Python checks (no Databricks credentials)
on:
  pull_request:
    branches: [develop, release, main]
  push:
    branches: [develop]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src/payer_lakehouse tests tools/check_contracts.py
      - name: Test
        run: python -m pytest -q
