
name: PAYER02 - CI

on:
  pull_request:
    branches:
      - develop
      - release
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  ci-validation:
    name: CI - Promotion and Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # -----------------------------------------
      # 1. Enforce strict branch promotion
      # -----------------------------------------
      - name: Validate branch promotion
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$SOURCE_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::PR must originate in this repository"
            exit 1
          fi

          case "$TARGET_BRANCH:$SOURCE_BRANCH" in

            develop:feature/*)
              DAB_TARGET=dev
              ;;

            release:develop)
              DAB_TARGET=test
              ;;

            main:release)
              DAB_TARGET=prod
              ;;

            *)
              echo "::error::Invalid promotion: $SOURCE_BRANCH -> $TARGET_BRANCH"
              exit 1
              ;;
          esac

          echo "DAB_TARGET=$DAB_TARGET" >> "$GITHUB_ENV"
          echo "Valid promotion: $SOURCE_BRANCH -> $TARGET_BRANCH"
          echo "Databricks target: $DAB_TARGET"

      # -----------------------------------------
      # 2. Checkout PR code
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------
      # 3. Python environment
      # -----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyyaml

      # -----------------------------------------
      # 4. Code quality
      # -----------------------------------------
      - name: Ruff lint
        run: python -m ruff check .

      # -----------------------------------------
      # 5. Unit tests
      # -----------------------------------------
      - name: Pytest
        run: python -m pytest tests/member/unit -v

      # -----------------------------------------
      # 6. Validate bundle YAML syntax
      # -----------------------------------------
      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = [
              Path("databricks.yml"),
              *Path("resources").rglob("*.yml"),
          ]

          for path in files:
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"Valid YAML: {path}")

          print(f"Validated {len(files)} YAML files")
          PY

      - name: CI completed
        run: |
          echo "CI passed for target: $DAB_TARGET"
