resources:
  jobs:
    bronze_initialize_tables_validate:
      name: PAYER02_${bundle.target}_bronze_initialize_validate
      max_concurrent_runs: 1
      tasks:
        - task_key: validate_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/00_initialize_bronze.py
            parameters:
              - "--target"
              - "${bundle.target}"
              - "--catalog"
              - "${var.catalog}"
              - "--mode"
              - "dry-run"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - "../dist/*.whl"
