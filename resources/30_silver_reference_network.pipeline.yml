
resources:
  pipelines:
    silver_reference_network:
      name: PAYER02_${bundle.target}_silver_reference_network

      catalog: ${var.catalog}
      schema: silver

      serverless: true

      configuration:
        source_catalog: ${var.catalog}
        pipelines.numUpdateRetryAttempts: "0"
        pipelines.maxFlowRetryAttempts: "0"

      environment:
        dependencies:
          - "../dist/*.whl"

      libraries:
        - file:
            path: ../src/pipelines/silver_conformed/01_reference_network.py
