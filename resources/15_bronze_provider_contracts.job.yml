resources:
  jobs:
    bronze_provider_contracts_load:
      name: PAYER02_${bundle.target}_bronze_provider_contracts
      max_concurrent_runs: 1

##************************** SNAPSHOT load tasks ********************************
      tasks:
      ##load practitioner_snapshot
        - task_key: load_practitioner_snapshot
          environment_key: default

          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: false

          spark_python_task:
            python_file: ../src/jobs/10_bronze_snapshot.py
            parameters:
              - "--target"
              - "${bundle.target}"

              - "--catalog"
              - "${var.catalog}"

              - "--entity"
              - "practitioner"

        ##load practitioner_specialty
