resources:
  jobs:
    bronze_claims_load:
      name: PAYER02_${bundle.target}_bronze_claims
      max_concurrent_runs: 1

      tasks:
## *************** Claims  - SNAPSHOT ******************
# Member master snapshot
        - task_key: load_claim_header_snapshot
          environment_key: default

          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: false

          spark_python_task:
            python_file: ../src/jobs/10_bronze_snapshot.py
            parameters:
            - "--target"
            - "${bundle.target}"
            
            - "--catalog"
            - "${var.catalog}"
            
            - "--entity"
            - "claim_header"


# Subscription snapshot
        - task_key: load_claim_line_snapshot
          environment_key: default

          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: false

          depends_on:
            - task_key: load_claim_header_snapshot

          spark_python_task:
            python_file: ../src/jobs/10_bronze_snapshot.py
            parameters:
            - "--target"
            - "${bundle.target}"
            
            - "--catalog"
            - "${var.catalog}"
            
            - "--entity"
            - "claim_line"

## *************** Claims  - CDC  ******************
# Member master snapshot
        - task_key: load_claim_header_cdc
          environment_key: default

          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: false

          depends_on:
            - task_key: load_claim_line_snapshot


          spark_python_task:
            python_file: ../src/jobs/11_bronze_cdc.py
            parameters:
            - "--target"
            - "${bundle.target}"
            
            - "--catalog"
            - "${var.catalog}"
            
            - "--entity"
            - "claim_header"


# Subscription snapshot
        - task_key: load_claim_line_cdc
          environment_key: default

          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: false

          depends_on:
            - task_key: load_claim_header_cdc

          spark_python_task:
            python_file: ../src/jobs/11_bronze_cdc.py
            parameters:
            - "--target"
            - "${bundle.target}"
            
            - "--catalog"
            - "${var.catalog}"
            
            - "--entity"
            - "claim_line"


      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - "../dist/*.whl"