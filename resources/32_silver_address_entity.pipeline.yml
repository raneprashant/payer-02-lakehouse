
resources:
  pipelines:
    silver_address_entity:
      name: PAYER02_${bundle.target}_silver_address_entity

      catalog: ${var.catalog}
      schema: silver

      serverless: true

      configuration:
        source_catalog: ${var.catalog}
        pipelines.numUpdateRetryAttempts: "0"
        pipelines.maxFlowRetryAttempts: "0"

      environment:
        dependencies:
          - "../dist/*.whl"

      libraries:
        - file:
            path: ../src/pipelines/silver_conformed/03_address_entity.py
