
resources:
  jobs:
    silver_eligibility_change_audit:
      name: PAYER02_${bundle.target}_silver_eligibility_change_audit
      max_concurrent_runs: 1

      tasks:
        - task_key: eligibility_change_audit
          environment_key: default

          spark_python_task:
            python_file: ../src/jobs/eligibility_change_audit.py
            parameters:
              - "--catalog"
              - "${var.catalog}"


      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - "../dist/*.whl"