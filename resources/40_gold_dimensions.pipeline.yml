            path: ../src/pipelines/gold_dimensions/08_dim_employer_subgroup.sql
        - file:
            path: ../src/pipelines/gold_dimensions/09_dim_practitioner.sql
        - file:
            path: ../src/pipelines/gold_dimensions/10_dim_supplier.sql
        - file:
            path: ../src/pipelines/gold_dimensions/11_dim_supplier_location.sql
        - file:
            path: ../src/pipelines/gold_dimensions/12_dim_network.sql
        - file:
            path: ../src/pipelines/gold_dimensions/13_dim_specialty.sql
        - file:
            path: ../src/pipelines/gold_dimensions/14_dim_procedure.sql
        - file:
            path: ../src/pipelines/gold_dimensions/15_dim_geography.sql

