# Healthcare Payer 360 — Declarative Automation Bundle (formerly DAB)
# All targets use the SAME Databricks Free Edition workspace/profile.
# The target's catalog changes; only DEV is used for hands-on development.
bundle:
  name: payer_02_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog destination for this bundle target
  landing_schema:
    default: landing
  landing_volume:
    default: raw_files
  checkpoint_schema:
    default: control
  checkpoint_volume:
    default: checkpoints

workspace:
  # Uses current authenticated user. Distinct target roots within one workspace.
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

artifacts:
  payer_lakehouse:
    type: whl
    build: python -m build --wheel
    dynamic_version: true
    path: .

targets:
  dev:
    default: true

    workspace:
      host: https://dbc-536d8077-bb93.cloud.databricks.com

    variables:
      catalog: payer_02_dev


  test:
    workspace:
      host: https://dbc-536d8077-bb93.cloud.databricks.com

    variables:
      catalog: payer_02_test
  
  prod:
    workspace:
      host: https://dbc-536d8077-bb93.cloud.databricks.com
      
    variables:
      catalog: payer_02_prod
