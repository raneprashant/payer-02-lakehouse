
# Healthcare Payer 360 - Databricks Bundle

bundle:
  name: payer_02_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog destination for this bundle target

  landing_schema:
    default: landing

  landing_volume:
    default: raw_files

  checkpoint_schema:
    default: control

  checkpoint_volume:
    default: checkpoints

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

artifacts:
  payer_lakehouse:
    type: whl
    build: python -m build --wheel
    dynamic_version: true
    path: .

targets:

  # ====================================
  # DEV - Monthly schedule ACTIVE
  # ====================================
  dev:
    default: true

    workspace:
      host: https://dbc-536d8077-bb93.cloud.databricks.com

    variables:
      catalog: payer_02_dev

  # ====================================
  # TEST - Monthly schedule PAUSED
  # ====================================
  test:
    workspace:
      host: https://dbc-536d8077-bb93.cloud.databricks.com

    variables:
      catalog: payer_02_test

    resources:
      jobs:
        cdw_nightly_batch_load:
          schedule:
            quartz_cron_expression: "0 0 2 1 * ?"
            timezone_id: America/New_York
            pause_status: PAUSED

  # ====================================
  # PROD - Monthly schedule PAUSED
  # ====================================
  prod:
    workspace:
      host: https://dbc-536d8077-bb93.cloud.databricks.com

    variables:
      catalog: payer_02_prod

    resources:
      jobs:
        cdw_nightly_batch_load:
          schedule:
            quartz_cron_expression: "0 0 2 1 * ?"
            timezone_id: America/New_York
            pause_status: PAUSED
